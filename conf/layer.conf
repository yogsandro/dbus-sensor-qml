# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-dbus-sensor-qml"
BBFILE_PATTERN_meta-dbus-sensor-qml = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-dbus-sensor-qml = "6"

LAYERDEPENDS_meta-dbus-sensor-qml = "core"
LAYERSERIES_COMPAT_meta-dbus-sensor-qml = "wrynose"
