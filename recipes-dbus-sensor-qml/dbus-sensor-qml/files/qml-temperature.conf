<busconfig>
  <policy user="root">
    <allow own="com.example.Echo"/>
    <allow send_destination="com.example.Echo"
	send_path="/com/example/Echo"
       send_interface="org.freedesktop.DBus.Properties"
       send_member="Get"/>
    <allow send_destination="com.example.Echo"
	send_path="/com/example/Echo"
       send_interface="org.freedesktop.DBus.Properties"
       send_member="GetAll"/>
  </policy>
</busconfig>
